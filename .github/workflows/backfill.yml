name: Backfill

on:
  workflow_dispatch:
    inputs:
      max_stocks:
        description: "本次最多處理幾檔 (0 = 全部)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Restore raw data cache
        uses: actions/cache@v4
        with:
          path: cache/
          key: pipeline-backfill-${{ github.run_id }}
          restore-keys: |
            pipeline-backfill-
            pipeline-raw-

      - name: Run backfill (forced refresh)
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python -m pipeline.build --backfill

      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache/
          key: pipeline-backfill-${{ github.run_id }}

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Backfill $(date -u +%Y-%m-%d)"
            git push
          fi
